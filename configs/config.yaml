# Main configuration file with all default values

# Keep training outputs in the project tree instead of Hydra's run directory.
hydra:
  job:
    chdir: false
  run:
    dir: ${save_path}
  output_subdir: null

# Which sweep config to use by default
defaults:
  - sweep: conv1d
  - _self_


# ============ Sweep Parameters (will be overridden by sweep configs) ============
# These are placeholders - actual values come from sweep/*.yaml
clim: ???  
degree: ???
emph_quantile: ???
temp_enc: ???
layers: ???
epochs: 100


# ============ Data Paths ============
cmip_dir: processed_data/cmip6 #cmip6_dir'cmip6'
ref_dir: processed_data/Livneh/unsplit #unsplit_livneh_dir
ref: 'livneh'
ref_var: 'prec'
input_attrs: 'elev;slope;aspect;landcover'

# ============ Training Periods ============
train_start: 1979
train_end: 2000
val_start: 1965
val_end: 1978

# ============ Model Architecture ============
monotone: true
transform_type: 'monotone'
hidden_size: 64
autoregression: false
lag: 3
time_scale: 'julian-day' #useful if n_harmonics is not 0 or else ignore
n_harmonics: 0


# ============ Training Hyperparameters ============
batch_size: 5 #use 2 for spatial test
learning_rate: 1e-4 # 1e-3 for spatial test

# Loss functions (list is okay here, not swept)
loss: ['quantile', 'rainy_day', 'spatial_correlation']

# ============ Chunking ============
chunk: true
chunk_size: 365
stride: 90
neighbors: 16

# ============ Flags ============
wet_dry_flag: true
train: true
validation: true
logging: true

# ============ Spatial Settings ============
spatial_test: false
shapefile_filter_path: processed_data/shapefiles/us_huc/contents/WBDHU2.shp
spatial_extent: ['01', '02', '03', '04', '06', '08', '09', '10', '11', '12', '13', '14', '15', '16', '17', '18']
spatial_extent_val: ['07'] #Upper Mississippi region for validation in spatial test
spatial_extent_test: ['05'] #Ohio region for testing in spatial test

# ============ Output Paths ============
save_path: 'outputs/test'
logging_path: 'runs/test'
# ============ GPU Settings ============
available_gpus: [0, 1, 2, 3]


