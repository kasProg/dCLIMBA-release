name: tests

# This workflow covers only the pure-logic modules under tests/ (loss math,
# model shape/monotonicity contracts, normalization round-trips, climate
# indices, model-selector scoring). It intentionally does NOT try to
# reproduce the full GPU/NetCDF training-and-evaluation pipeline described in
# env.yaml -- that requires real climate data and CUDA hardware that aren't
# available here. Treat this as a fast regression check on plumbing, not a
# substitute for smoke-testing run_exp.py/eval_exp.py on real data.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU-only test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy scipy pandas xarray geopandas regionmask cftime \
                      esda libpysal pyyaml pytest

      - name: Run pytest
        run: pytest tests/ -v
